version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autocarros-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autocarros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard_autocarros}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autocarros}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autocarros-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autocarros-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-autocarros}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-dashboard_autocarros}?schema=public
      PORT: ${BACKEND_PORT:-6000}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-6000}:6000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - autocarros-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:6000}
    container_name: autocarros-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - autocarros-network

volumes:
  postgres_data:
    driver: local

networks:
  autocarros-network:
    driver: bridge

